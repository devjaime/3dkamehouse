<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer hexagon shape -->
  <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" stroke="#00e5ff" stroke-width="1.5" fill="none" opacity="0.9"/>
  <!-- Inner cube wireframe -->
  <polygon points="32,16 48,24 48,40 32,48 16,40 16,24" stroke="#00e5ff" stroke-width="1" fill="none" opacity="0.5"/>
  <!-- Cube top face -->
  <polygon points="32,16 48,24 32,32 16,24" stroke="#00e5ff" stroke-width="1" fill="none" opacity="0.4"/>
  <!-- Cube center lines -->
  <line x1="32" y1="32" x2="32" y2="48" stroke="#00e5ff" stroke-width="1" opacity="0.3"/>
  <line x1="32" y1="32" x2="48" y2="40" stroke="#00e5ff" stroke-width="1" opacity="0.3"/>
  <line x1="32" y1="32" x2="16" y2="40" stroke="#00e5ff" stroke-width="1" opacity="0.3"/>
  <!-- Corner dots -->
  <circle cx="32" cy="16" r="1.5" fill="#00e5ff"/>
  <circle cx="48" cy="24" r="1.5" fill="#00e5ff"/>
  <circle cx="48" cy="40" r="1.5" fill="#00e5ff"/>
  <circle cx="32" cy="48" r="1.5" fill="#00e5ff"/>
  <circle cx="16" cy="40" r="1.5" fill="#00e5ff"/>
  <circle cx="16" cy="24" r="1.5" fill="#00e5ff"/>
  <circle cx="32" cy="32" r="2" fill="#7b2fff" opacity="0.8"/>
</svg>
